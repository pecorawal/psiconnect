# Instale com: .venv/bin/pre-commit install
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: detect-private-key
      # O repositório anterior commitou a venv inteira. Este hook barra isso.
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [app]

      - id: sem-venv-commitada
        name: bloquear commit de venv ou .env
        entry: bash -c 'git diff --cached --name-only | grep -qE "^(\.venv|venv|efata)/|^\.env$" && { echo "Recusando: venv ou .env no commit."; exit 1; } || exit 0'
        language: system
        pass_filenames: false

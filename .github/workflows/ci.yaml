name: CI

on:
  pull_request:
  # Roda também no push para dev porque o workflow auto-pr-dev.yaml abre um PR
  # automático a cada push nessa branch. Sem esta linha, código quebrado poderia
  # chegar a um PR já aberto sem nunca ser verificado.
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  qualidade:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: psiconnect
          POSTGRES_PASSWORD: psiconnect
          POSTGRES_DB: psiconnect
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U psiconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: teste
      APP_SECRET_KEY: chave-de-ci-com-mais-de-32-bytes-para-passar
      DATABASE_URL: postgresql+psycopg://psiconnect:psiconnect@localhost:5433/psiconnect
      TEST_DATABASE_URL: postgresql+psycopg://psiconnect:psiconnect@localhost:5433/psiconnect

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Tipos (mypy strict)
        run: mypy app

      - name: Migrations
        run: alembic upgrade head

      - name: Migrations são reversíveis
        # Um downgrade quebrado só aparece quando é tarde. Testar o ciclo aqui
        # também prova que a migration é a fonte do schema -- o spike anterior
        # usava create_all(), que mascara migration inconsistente.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Modelos batem com as migrations
        # Falha se alguém alterou um modelo sem gerar migration.
        run: alembic check

      - name: Testes
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml
          if-no-files-found: ignore

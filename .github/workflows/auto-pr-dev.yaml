name: Auto PR dev -> main

on:
  push:
    branches: [dev]

permissions:
  # Declarar `permissions` zera tudo que não estiver aqui: sem `contents`, nem
  # o checkout roda.
  contents: read
  pull-requests: write

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abrir PR de dev para main
        env:
          GH_TOKEN: ${{ github.token }}
        # Bloco literal, e não `run:` numa linha só: o `feat:` que havia no
        # --title fazia o YAML ler a linha como mapeamento, e o workflow falhava
        # antes de iniciar qualquer job.
        #
        # `--fill` sozinho: o gh recusa combiná-lo com --title/--body, e o
        # título tirado dos commits diz mais que "atualizações automáticas".
        run: |
          gh pr create --base main --head dev --fill \
            || echo "nenhum PR criado (já existe um, ou dev não está à frente de main)"

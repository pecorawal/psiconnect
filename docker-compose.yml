name: psiconnect

services:
  db:
    # Imagem oficial pgvector. btree_gist (necessária para as constraints
    # EXCLUDE de agenda) já vem no contrib do Postgres.
    image: docker.io/pgvector/pgvector:0.8.6-pg17
    container_name: psiconnect-db
    environment:
      POSTGRES_USER: psiconnect
      # Senha vem do .env (gerado pelo `make env`), nunca do repositório.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env -- rode make env}
      POSTGRES_DB: psiconnect
      # Melhora o desempenho local; não usar em produção.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # 5433 no host evita colidir com um Postgres já instalado.
      - "5433:5432"
    volumes:
      # Volume nomeado, não bind-mount: com podman rootless o uid do postgres
      # dentro do container não consegue escrever num diretório do host.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psiconnect -d psiconnect"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    # SMTP fake para dev: captura os e-mails da outbox sem enviar nada.
    image: docker.io/axllent/mailpit:latest
    container_name: psiconnect-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI web
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

  minio:
    # Object storage S3-compatível. Guarda foto de perfil e documentos de
    # identificação — o bucket é PRIVADO e a autorização é da aplicação.
    # quay.io/minio e docker.io/minio deixaram de publicar o servidor; a
    # Chainguard mantém um build atualizado (inclui o mc do healthcheck).
    image: docker.io/chainguard/minio:latest
    container_name: psiconnect-minio
    command: server /data --console-address ":9001"
    environment:
      # As mesmas credenciais que a aplicação usa (S3_* no .env).
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?defina no .env -- rode make env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?defina no .env -- rode make env}
    ports:
      # 9010/9011 em vez de 9000/9001: o padrão colide com outros projetos que
      # já rodam MinIO na mesma máquina.
      - "9010:9000"  # API S3
      - "9011:9001"  # console web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- Aplicação (opcional) ----------------------------------------------
  # Fora do "make infra-up" de propósito: o dia a dia continua com "make dev"
  # (reload no host). Para rodar tudo no podman: make app-up.
  # network_mode host: o .env aponta para localhost:5433/9010/1025, e as URLs
  # assinadas do MinIO precisam abrir no navegador do mesmo jeito.
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/psiconnect:dev
    container_name: psiconnect-app
    network_mode: host
    env_file: .env
    environment:
      # Rodando tudo no podman, o e-mail sai de verdade para o Mailpit
      # (http://localhost:8025). O .env segue com console para os testes.
      NOTIFICACAO_PROVIDER: smtp
    depends_on: [db, mailpit, minio]
    restart: unless-stopped

  worker:
    profiles: ["app"]
    image: localhost/psiconnect:dev
    container_name: psiconnect-worker
    command: ["python", "-m", "app.workers"]
    network_mode: host
    env_file: .env
    environment:
      NOTIFICACAO_PROVIDER: smtp
    depends_on: [app]
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:

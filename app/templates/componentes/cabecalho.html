<header class="sticky top-0 z-40 border-b border-slate-200 bg-white/90 backdrop-blur">
  <div class="mx-auto flex h-16 w-full max-w-5xl items-center justify-between gap-4 px-4">

    <a href="{{ url_for('home') }}" class="flex items-center gap-2 font-semibold text-slate-900">
      <span aria-hidden="true"
            class="grid h-8 w-8 place-items-center rounded-lg bg-teal-700 text-sm font-bold text-white">
        Psi
      </span>
      <span>{{ app_nome }}</span>
    </a>

    <nav class="flex items-center gap-1 text-sm" aria-label="Principal">
      {% if usuario is defined and usuario %}
        <a href="/painel" class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100">Painel</a>
        <form method="post" action="/sair" class="contents">
          <button type="submit" class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100">
            Sair
          </button>
        </form>
      {% else %}
        <a href="/entrar" class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100">Entrar</a>
        <a href="/cadastro/paciente"
           class="rounded-lg bg-teal-700 px-4 py-2 font-medium text-white hover:bg-teal-800">
          Começar
        </a>
      {% endif %}
    </nav>
  </div>

  {% if eh_dev %}
  <div class="bg-amber-100 px-4 py-1 text-center text-xs text-amber-900">
    ambiente <strong>{{ app_env }}</strong> — pagamentos e vídeo simulados
  </div>
  {% endif %}
</header>

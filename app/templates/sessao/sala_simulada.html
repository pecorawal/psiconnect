<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sala simulada</title>
  <style>
    /* Página isolada de propósito: ela ocupa um iframe e não deve herdar o
       layout do app. Estilo inline evita uma requisição a mais. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh; display: grid; place-items: center; gap: 1rem;
      background: #0f172a; color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    .painel { text-align: center; padding: 2rem; }
    .selo {
      display: inline-block; padding: .25rem .75rem; border-radius: 999px;
      background: #7c2d12; color: #fed7aa; font-size: .75rem; margin-bottom: 1.5rem;
    }
    .grade { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .quadro {
      width: 15rem; height: 9rem; border-radius: .75rem; display: grid;
      place-items: center; background: #1e293b; border: 1px solid #334155;
    }
    .avatar {
      width: 3.5rem; height: 3.5rem; border-radius: 999px; background: #0f766e;
      display: grid; place-items: center; font-size: 1.25rem; font-weight: 600;
      color: #fff;
    }
    .rotulo { font-size: .75rem; color: #94a3b8; margin-top: .5rem; }
    .cronometro { font-size: 2rem; font-variant-numeric: tabular-nums; margin-top: 1.5rem; }
    .dica { font-size: .75rem; color: #64748b; margin-top: 1rem; max-width: 26rem; }
  </style>
</head>
<body>
  <div class="painel">
    <span class="selo">sala simulada — sem vídeo real</span>

    <div class="grade">
      <div>
        <div class="quadro"><div class="avatar">P</div></div>
        <p class="rotulo">Profissional</p>
      </div>
      <div>
        <div class="quadro"><div class="avatar">V</div></div>
        <p class="rotulo">Você</p>
      </div>
    </div>

    <p class="cronometro" id="cronometro">00:00</p>

    <p class="dica">
      Com <code>VIDEO_PROVIDER=fake</code> a chamada não é real, mas todo o fluxo em volta
      é: disclaimer, sala de espera, admissão pelo profissional e encerramento.
      Trocar para o daily.co não muda nada fora deste quadro.
    </p>
  </div>

  <script>
    // Cronômetro: torna evidente que a sala está "viva" durante a demonstração.
    (function () {
      var inicio = Date.now();
      setInterval(function () {
        var s = Math.floor((Date.now() - inicio) / 1000);
        document.getElementById("cronometro").textContent =
          String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      }, 1000);
    })();
  </script>
</body>
</html>

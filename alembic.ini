[alembic]
script_location = alembic
prepend_sys_path = .
# A URL vem de app.core.config (env.py); nada de credencial neste arquivo.
sqlalchemy.url =

# Migrations nomeadas com número sequencial + slug, em vez do hash aleatório
# padrão -- a ordem fica legível no `ls alembic/versions`.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

# Sem post_write_hook: o alembic invoca o interpretador do sistema, que não tem
# o ruff da venv, e a falha só aparece como ruído. O `make nova-migration` já
# formata em seguida.
[post_write_hooks]
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[alembic]
script_location = alembic
prepend_sys_path = .
# A URL vem de app.core.config (env.py); nada de credencial neste arquivo.
sqlalchemy.url =

# Migrations nomeadas com número sequencial + slug, em vez do hash aleatório
# padrão -- a ordem fica legível no `ls alembic/versions`.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
# `python -m ruff` em vez de `ruff`: acha o binário da venv ativa sem depender
# de o diretório bin estar no PATH.
ruff_format.executable = python
ruff_format.options = -m ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
